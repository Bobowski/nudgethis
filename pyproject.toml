[project]
name = "nudgethis"
version = "0.1.0"
description = "A frame around a live web app: snap it, draw on it, tell Nudge what to change"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=44",
    "httpx>=0.28.1",
    "litewriter>=0.3.2,<0.4",
    "pydantic-ai-slim[openai]>=2.38.0",
    "stario>=5.3.3,<6",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "watchfiles>=1.3.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".agents", ".claude", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
